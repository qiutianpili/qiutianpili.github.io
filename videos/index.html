  <script>
    (function () {
      /* 新增视频：把文件放进 /videos/，再在这里加一行。poster 可选。 */
      var VIDEOS = [
        { file: "haozi.mp4", title: "haozi", poster: "haozi.webp", dur: "4:15", res: "432 × 960 竖屏", size: "20.7 MB" }
      ];
      var player = document.getElementById("vd-player"), list = document.getElementById("vd-list");
      function $(id) { return document.getElementById(id); }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      function pick(i, play) {
        var v = VIDEOS[i];
        player.src = v.file; if (v.poster) player.poster = v.poster; else player.removeAttribute("poster");
        $("vd-title").textContent = v.title; $("vd-dur").textContent = v.dur || "—"; $("vd-res").textContent = v.res || "—"; $("vd-size").textContent = v.size || "—";
        $("vd-dl").href = v.file; $("vd-open").href = v.file;
        [].forEach.call(list.querySelectorAll("button"), function (b, k) { b.setAttribute("aria-current", k === i ? "true" : "false"); });
        history.replaceState(null, "", "#" + encodeURIComponent(v.file));
        if (play) player.play().catch(function () {});
      }
      list.innerHTML = VIDEOS.map(function (v, i) {
        return '<li><button type="button" data-i="' + i + '"><img src="' + esc(v.poster || "") + '" alt="" loading="lazy"><b>' + esc(v.title) + "</b><small>" + esc(v.dur || "") + "</small></button></li>";
      }).join("");
      list.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-i]"); if (!b) return;
        pick(+b.dataset.i, true); player.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      var h = decodeURIComponent(location.hash.slice(1)), start = 0;
      VIDEOS.forEach(function (v, i) { if (v.file === h) start = i; });
      pick(start, false);
    })();
  </script>

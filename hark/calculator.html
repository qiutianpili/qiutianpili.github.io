  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var exprEl = $("expr"), outEl = $("out"), calc = $("calc"), histEl = $("hist"), histEmpty = $("hist-empty");
    var expr = "", ans = 0, deg = true, justEval = false;
    var HKEY = "hark-calc-history", history = [];
    try { history = JSON.parse(localStorage.getItem(HKEY) || "[]") || []; } catch (e) { history = []; }

    /* ---------- safe parser (no eval) ---------- */
    function tokenize(s) {
      var t = [], i = 0, m;
      while (i < s.length) {
        var c = s[i];
        if (c === " ") { i++; continue; }
        if ((m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i))) && !/^e[^+\-\d]/.test(s.slice(i))) {
          if (/\d|\./.test(c)) { t.push({ t: "n", v: parseFloat(m[0]) }); i += m[0].length; continue; }
        }
        if ((m = /^(sin|cos|tan|ln|log|√)/.exec(s.slice(i)))) { t.push({ t: "f", v: m[0] }); i += m[0].length; continue; }
        if (c === "π") { t.push({ t: "n", v: Math.PI }); i++; continue; }
        if (c === "e") { t.push({ t: "n", v: Math.E }); i++; continue; }
        if (s.slice(i, i + 3) === "Ans") { t.push({ t: "n", v: ans }); i += 3; continue; }
        if ("+−-×*÷/^()%!".indexOf(c) >= 0) {
          var v = c === "−" ? "-" : c === "×" ? "*" : c === "÷" ? "/" : c;
          t.push({ t: "o", v: v }); i++; continue;
        }
        throw new Error("无法识别：" + c);
      }
      return t;
    }
    function fact(n) {
      if (n < 0 || Math.floor(n) !== n) throw new Error("阶乘只支持非负整数");
      if (n > 170) return Infinity;
      var r = 1; for (var i = 2; i <= n; i++) r *= i; return r;
    }
    function evaluate(s) {
      var tk = tokenize(s), p = 0;
      function peek() { return tk[p]; }
      function isOp(v) { var x = tk[p]; return x && x.t === "o" && x.v === v; }
      function startsPrimary(x) { return x && (x.t === "n" || x.t === "f" || (x.t === "o" && x.v === "(")); }
      function expr() {
        var v = term();
        while (isOp("+") || isOp("-")) {
          var op = tk[p++].v, r = term();
          if (tk[p - 1] && tk[p - 1].pct) r = v * r;
          v = op === "+" ? v + r : v - r;
        }
        return v;
      }
      function term() {
        var v = unary();
        for (;;) {
          if (isOp("*") || isOp("/")) {
            var op = tk[p++].v, r = unary();
            if (op === "/" && r === 0) throw new Error("不能除以 0");
            v = op === "*" ? v * r : v / r;
          } else if (startsPrimary(peek())) { v = v * unary(); } /* implicit multiply: 2π, 3(4) */
          else break;
        }
        return v;
      }
      function unary() {
        if (isOp("-")) { p++; return -unary(); }
        if (isOp("+")) { p++; return unary(); }
        return power();
      }
      function power() {
        var b = postfix();
        if (isOp("^")) { p++; var e = unary(); return Math.pow(b, e); }
        return b;
      }
      function postfix() {
        var v = primary();
        for (;;) {
          if (isOp("!")) { p++; v = fact(v); }
          else if (isOp("%")) { p++; v = v / 100; tk[p - 1].pct = true; }
          else break;
        }
        return v;
      }
      function primary() {
        var x = tk[p];
        if (!x) throw new Error("算式不完整");
        if (x.t === "n") { p++; return x.v; }
        if (x.t === "f") {
          p++;
          var a = isOp("(") ? group() : postfix();
          var r = deg ? a * Math.PI / 180 : a;
          switch (x.v) {
            case "sin": return clean(Math.sin(r));
            case "cos": return clean(Math.cos(r));
            case "tan":
              if (Math.abs(Math.cos(r)) < 1e-12) throw new Error("tan 在此处无定义");
              return clean(Math.tan(r));
            case "ln": if (a <= 0) throw new Error("ln 需要正数"); return Math.log(a);
            case "log": if (a <= 0) throw new Error("log 需要正数"); return Math.log10(a);
            case "√": if (a < 0) throw new Error("负数不能开平方"); return Math.sqrt(a);
          }
        }
        if (x.t === "o" && x.v === "(") return group();
        throw new Error("算式有误");
      }
      function group() {
        p++; var v = expr();
        if (isOp(")")) p++; /* allow missing closing parens */
        return v;
      }
      var v = expr();
      if (p < tk.length) throw new Error("算式有误");
      if (!isFinite(v)) throw new Error(isNaN(v) ? "结果无效" : "结果太大");
      return v;
    }
    function clean(x) { return Math.abs(x) < 1e-12 ? 0 : x; }
    function fmt(v) {
      if (Object.is(v, -0)) v = 0;
      var a = Math.abs(v);
      if (a !== 0 && (a >= 1e15 || a < 1e-9)) return v.toExponential(8).replace(/\.?0+e/, "e");
      var s = parseFloat(v.toPrecision(12)).toString();
      var parts = s.split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    /* ---------- UI ---------- */
    function preview() {
      if (!expr) return "0";
      try { return fmt(evaluate(expr)); } catch (e) { return null; }
    }
    function render(result, err) {
      exprEl.textContent = expr;
      outEl.classList.toggle("is-err", !!err);
      if (err) { outEl.textContent = err; return; }
      if (result !== undefined) { outEl.textContent = result; return; }
      var pv = preview();
      outEl.textContent = pv === null ? (outEl.textContent || "0") : pv;
      $("clear").textContent = expr ? "C" : "AC";
    }
    var OPS = "+−×÷^";
    function input(k) {
      if (k === "clear") { expr = ""; justEval = false; return render(); }
      if (k === "back") { expr = justEval ? "" : expr.replace(/(sin\(|cos\(|tan\(|ln\(|log\(|√\(|Ans|.)$/, ""); justEval = false; return render(); }
      if (k === "=") return equals();
      if (k === "neg") {
        var m = /(\d+\.?\d*|π|e|Ans|\))$/.exec(expr);
        if (!expr) { expr = "−"; }
        else if (/\(−[^()]*\)$/.test(expr)) expr = expr.replace(/\(−([^()]*)\)$/, "$1");
        else if (m) { var i = expr.length - m[0].length; expr = expr.slice(0, i) + "(−" + m[0] + ")"; }
        justEval = false; return render();
      }
      if (k === "ans") k = "Ans";
      if (justEval) {
        if (OPS.indexOf(k) >= 0 || k === "^2" || k === "!" || k === "%") expr = "Ans";
        else expr = "";
        justEval = false;
      }
      var last = expr.slice(-1);
      if (OPS.indexOf(k) >= 0 && k !== "−") {
        if (!expr) expr = "Ans";
        else if (OPS.indexOf(last) >= 0) expr = expr.slice(0, -1);
      }
      if (k === "−" && last === "−") return;
      if (k === ".") {
        var num = /(\d*\.?\d*)$/.exec(expr)[0];
        if (num.indexOf(".") >= 0) return;
        if (!num) k = "0.";
      }
      expr += k;
      render();
    }
    function equals() {
      if (!expr) return;
      try {
        var v = evaluate(expr);
        var shown = expr;
        ans = v;
        history.unshift({ e: shown, r: fmt(v), v: v });
        history = history.slice(0, 50);
        try { localStorage.setItem(HKEY, JSON.stringify(history)); } catch (e) {}
        drawHistory();
        exprEl.textContent = shown + " =";
        outEl.classList.remove("is-err");
        outEl.textContent = fmt(v);
        expr = String(v).length > 16 ? String(parseFloat(v.toPrecision(15))) : String(v);
        if (/e/.test(expr)) expr = "Ans";
        justEval = true;
        $("clear").textContent = "AC";
      } catch (e) {
        render(undefined, e.message);
      }
    }
    function drawHistory() {
      histEl.innerHTML = "";
      histEmpty.style.display = history.length ? "none" : "";
      history.forEach(function (h) {
        var li = document.createElement("li"), b = document.createElement("button");
        b.type = "button";
        var sm = document.createElement("small"); sm.textContent = h.e + " =";
        var bb = document.createElement("b"); bb.textContent = h.r;
        b.appendChild(sm); b.appendChild(bb);
        b.addEventListener("click", function () {
          ans = h.v; expr = "Ans"; justEval = true;
          exprEl.textContent = h.e + " ="; outEl.classList.remove("is-err"); outEl.textContent = h.r;
        });
        li.appendChild(b); histEl.appendChild(li);
      });
    }

    calc.addEventListener("click", function (ev) {
      var b = ev.target.closest(".k"); if (!b) return;
      input(b.getAttribute("data-k"));
    });
    var mode = "basic", wrap = document.querySelector(".calc-wrap");
    function setMode(m) {
      if (m === true) m = "sci"; if (m === false) m = "basic";
      mode = m;
      calc.classList.toggle("is-sci", m === "sci");
      calc.classList.toggle("is-kin", m === "kin");
      wrap.classList.toggle("is-kin", m === "kin");
      calc.classList.toggle("is-age", m === "age");
      wrap.classList.toggle("is-age", m === "age");
      $("kin").hidden = m !== "kin";
      $("age").hidden = m !== "age";
      $("m-age").setAttribute("aria-pressed", m === "age");
      $("m-basic").setAttribute("aria-pressed", m === "basic");
      $("m-sci").setAttribute("aria-pressed", m === "sci");
      $("m-kin").setAttribute("aria-pressed", m === "kin");
      if (m === "kin") kinInit();
      if (m === "age") ageInit();
      try { localStorage.setItem("hark-calc-mode", m); } catch (e) {}
    }
    $("m-basic").addEventListener("click", function () { setMode("basic"); });
    $("m-sci").addEventListener("click", function () { setMode("sci"); });
    $("m-kin").addEventListener("click", function () { setMode("kin"); });
    $("m-age").addEventListener("click", function () { setMode("age"); });

    /* ---------- 年龄计算 ---------- */
    var ZODIAC = "鼠牛虎兔龙蛇马羊猴鸡狗猪";
    var STARS = [[120, "摩羯座"], [219, "水瓶座"], [321, "双鱼座"], [420, "白羊座"], [521, "金牛座"], [622, "双子座"], [723, "巨蟹座"], [823, "狮子座"], [923, "处女座"], [1024, "天秤座"], [1123, "天蝎座"], [1222, "射手座"], [1232, "摩羯座"]];
    var WEEK = "日一二三四五六";
    function pad2(n) { return (n < 10 ? "0" : "") + n; }
    function iso(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
    function parseD(v) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
    function dayDiff(a, b) { return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5); }
    function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
    /* birthday in year y; a Feb 29 birthday falls on Feb 28 in common years */
    function bdayIn(b, y) { return new Date(y, b.getMonth(), Math.min(b.getDate(), dim(y, b.getMonth()))); }
    function lunarYear(d) {
      try {
        var parts = new Intl.DateTimeFormat("zh-u-ca-chinese", { year: "numeric" }).formatToParts(d);
        for (var i = 0; i < parts.length; i++) if (parts[i].type === "relatedYear") return +parts[i].value;
      } catch (e) {}
      return null;
    }
    function star(d) { var k = (d.getMonth() + 1) * 100 + d.getDate(); for (var i = 0; i < STARS.length; i++) if (k < STARS[i][0]) return STARS[i][1]; return "摩羯座"; }
    function ageInit() {
      var to = $("age-to");
      if (!to.value) to.value = iso(new Date());
      var b = $("age-birth");
      if (!b.value) { try { b.value = localStorage.getItem("hark-calc-birth") || ""; } catch (e) {} }
      b.max = iso(new Date());
      ageRender();
    }
    function ageRender() {
      var b = parseD($("age-birth").value), t = parseD($("age-to").value) || new Date(), out = $("age-out"), sub = $("age-sub"), grid = $("age-grid");
      grid.innerHTML = "";
      if (!b) { out.className = "calc__out is-hint"; out.textContent = "—"; sub.textContent = "选择出生日期"; return; }
      try { localStorage.setItem("hark-calc-birth", $("age-birth").value); } catch (e) {}
      if (dayDiff(b, t) < 0) { out.className = "calc__out is-hint"; out.textContent = "计算日期早于出生日期"; sub.textContent = ""; return; }
      /* exact Y-M-D */
      var tm = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
      function addM(n) { var yy = b.getFullYear() + Math.floor((b.getMonth() + n) / 12), mm = (b.getMonth() + n) % 12; return new Date(yy, mm, Math.min(b.getDate(), dim(yy, mm))); }
      var anchor = addM(tm);
      if (dayDiff(anchor, t) < 0) { tm--; anchor = addM(tm); }
      var y = Math.floor(tm / 12), m = tm % 12, d = dayDiff(anchor, t);
      var full = y;
      var days = dayDiff(b, t);
      var ly = lunarYear(t), lb = lunarYear(b);
      var xu = ly && lb ? ly - lb + 1 : t.getFullYear() - b.getFullYear() + 1;
      var zy = lb || b.getFullYear();
      var next = bdayIn(b, t.getFullYear());
      if (dayDiff(t, next) < 0) next = bdayIn(b, t.getFullYear() + 1);
      var left = dayDiff(t, next);
      out.className = "calc__out";
      out.textContent = full + " 周岁";
      sub.textContent = left === 0 ? "🎂 今天生日，生日快乐！" : "虚岁 " + xu + " 岁";
      var rows = [
        ["精确年龄", y + " 年 " + m + " 个月 " + d + " 天"],
        ["虚岁", xu + " 岁"],
        ["已活天数", days.toLocaleString("zh-CN") + " 天"],
        ["约合周数", Math.floor(days / 7).toLocaleString("zh-CN") + " 周"],
        ["下次生日", left === 0 ? "就是今天" : "还有 " + left + " 天（" + (next.getMonth() + 1) + "月" + next.getDate() + "日 周" + WEEK[next.getDay()] + "）"],
        ["出生那天", "星期" + WEEK[b.getDay()]],
        ["生肖", ZODIAC[((zy - 4) % 12 + 12) % 12]],
        ["星座", star(b)]
      ];
      rows.forEach(function (r) {
        var div = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
        dt.textContent = r[0]; dd.textContent = r[1]; div.appendChild(dt); div.appendChild(dd); grid.appendChild(div);
      });
    }
    $("age-birth").addEventListener("input", ageRender);
    $("age-to").addEventListener("input", ageRender);

    /* ---------- 亲戚称呼 (relationship.js, MIT, vendored at /assets/relationship.min.js) ---------- */
    var kinChain = [], kinSex = 1, kinRev = false, kinLib = null, kinLoading = false;
    var MALE = { "爸爸": 1, "老公": 1, "哥哥": 1, "弟弟": 1, "儿子": 1 };
    function kinInit() {
      if (kinLib || kinLoading) return kinRender();
      kinLoading = true;
      $("kin-out").textContent = "加载中…";
      var sc = document.createElement("script");
      sc.src = "/assets/relationship.min.js";
      sc.onload = function () { kinLib = window.relationship; kinLoading = false; kinRender(); };
      sc.onerror = function () { kinLoading = false; $("kin-out").textContent = "称呼数据加载失败，请刷新重试"; };
      document.head.appendChild(sc);
    }
    function lastIsMale() {
      if (!kinChain.length) return kinSex === 1;
      return !!MALE[kinChain[kinChain.length - 1]];
    }
    function kinRender() {
      var chainEl = $("kin-chain"), out = $("kin-out");
      chainEl.textContent = kinChain.length ? "我的" + kinChain.join("的") : "我";
      /* a man has no 老公 and a woman no 老婆 in this chain, so disable the impossible spouse key */
      var male = lastIsMale();
      [].forEach.call(document.querySelectorAll(".kk[data-r]"), function (b) {
        var r = b.getAttribute("data-r");
        b.disabled = (r === "老公" && male) || (r === "老婆" && !male);
      });
      out.classList.remove("is-err");
      if (!kinChain.length) { out.classList.add("is-hint"); out.textContent = "选择关系开始"; return; }
      if (!kinLib) return;
      var res = [];
      try { res = kinLib({ text: kinChain.join("的"), sex: kinSex, reverse: kinRev }) || []; } catch (e) { res = []; }
      out.classList.remove("is-hint");
      if (!res.length) { out.classList.add("is-hint"); out.textContent = kinChain.length > 6 ? "关系太远，算不出来啦" : "没有对应称呼"; return; }
      out.textContent = (kinRev ? "TA 叫我：" : "") + res.slice(0, 4).join(" / ");
    }
    $("kin").addEventListener("click", function (ev) {
      var b = ev.target.closest(".kk"); if (b && !b.disabled) {
        var r = b.getAttribute("data-r");
        if (r === "clear") kinChain = [];
        else if (r === "back") kinChain.pop();
        else if (kinChain.length < 10) kinChain.push(r);
        return kinRender();
      }
      var s = ev.target.closest(".seg__b"); if (s) {
        kinSex = +s.getAttribute("data-sex");
        [].forEach.call(document.querySelectorAll(".seg__b"), function (x) { x.setAttribute("aria-pressed", x === s); });
        /* drop links that no longer make sense, e.g. switching to 女生 after choosing 老婆 first */
        var keep = [];
        for (var i = 0; i < kinChain.length; i++) {
          var prevMale = i === 0 ? kinSex === 1 : !!MALE[kinChain[i - 1]];
          if ((kinChain[i] === "老公" && prevMale) || (kinChain[i] === "老婆" && !prevMale)) break;
          keep.push(kinChain[i]);
        }
        kinChain = keep;
        return kinRender();
      }
    });
    $("kin-rev").addEventListener("click", function () {
      kinRev = !kinRev;
      this.setAttribute("aria-pressed", kinRev);
      this.textContent = kinRev ? "TA 叫我" : "我叫 TA";
      kinRender();
    });
    $("m-angle").addEventListener("click", function () {
      deg = !deg; this.textContent = deg ? "DEG" : "RAD";
      this.setAttribute("aria-pressed", !deg); render();
    });
    $("hist-clear").addEventListener("click", function () {
      history = []; try { localStorage.removeItem(HKEY); } catch (e) {} drawHistory();
    });

    var KEYMAP = { "+": "+", "-": "−", "*": "×", "x": "×", "/": "÷", "^": "^", "(": "(", ")": ")", "%": "%", ".": ".", ",": ".", "!": "!",
      "Enter": "=", "=": "=", "Backspace": "back", "Escape": "clear", "Delete": "clear", "p": "π", "s": "sin(", "c": "cos(", "t": "tan(", "l": "ln(", "r": "√(" };
    document.addEventListener("keydown", function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey || mode === "kin" || mode === "age") return;
      var k = /^[0-9]$/.test(ev.key) ? ev.key : KEYMAP[ev.key];
      if (!k) return;
      ev.preventDefault();
      if (/^[sctlr]$/.test(ev.key)) setMode(true);
      input(k);
      var btn = calc.querySelector('.k[data-k="' + (k === "clear" ? "clear" : k) + '"]');
      if (btn) { btn.classList.add("is-hit"); setTimeout(function () { btn.classList.remove("is-hit"); }, 120); }
    });

    try {
      var savedMode = localStorage.getItem("hark-calc-mode") || (localStorage.getItem("hark-calc-sci") === "1" ? "sci" : "basic");
      if (savedMode !== "basic") setMode(savedMode);
    } catch (e) {}
    drawHistory(); render();
    window.__calcEval = evaluate;
  })();
  </script>
</body>
</html>

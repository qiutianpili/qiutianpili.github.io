    .feature-img { display: grid; place-items: center; overflow: hidden; height: 140px; margin: 10px 10px 0; padding: 20px; border-radius: var(--r-m); background: var(--fill-primary-on); }
    .feature-img img { width: 100%; height: 100%; object-fit: contain; }
    .feature-content { display: flex; flex-direction: column; gap: 6px; flex: 1; padding: 16px 20px 20px; }
    .feature-content h3 { margin: 0; font: var(--type-heading); }
    .feature-content p { margin: 0; color: var(--text-secondary); font-size: var(--size-body); line-height: 1.55; }
    .feature-content .links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; }
    .copy-tip { font: var(--type-tag); color: var(--fill-system-green); }
    .empty-hint { display: none; color: var(--text-secondary); margin-top: 8px; }
    @media (max-width: 420px) { .search-box button { padding: 0 16px; } }
  </style>

  <script>
    (function () {
      var input = document.querySelector('.search-box input');
      var button = document.querySelector('.search-box button');
      var hint = document.getElementById('empty-hint');
      function search() {
        var term = input.value.trim().toLowerCase(), shown = 0;
        document.querySelectorAll('.feature-card').forEach(function (card) {
          var title = card.querySelector('h3').textContent.toLowerCase();
          var desc = card.querySelector('p').textContent.toLowerCase();
          var hit = !term || title.indexOf(term) > -1 || desc.indexOf(term) > -1;
          card.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        hint.style.display = shown ? 'none' : 'block';
      }
      button.addEventListener('click', search);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
      input.addEventListener('input', function () { if (!input.value) search(); });
      var copy = document.getElementById('copy-link'), tip = document.getElementById('copy-tip');
      if (copy) copy.addEventListener('click', function () {
        var text = copy.getAttribute('data-clipboard-text') || '';
        function done() { tip.style.display = 'inline'; setTimeout(function () { tip.style.display = 'none'; }, 1600); }
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, function () {});
        else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} t.remove(); }
      });
    })();
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复制链接 | 秋天霹雳</title>
  <meta name="description" content="新年祝福分享页，一键复制分享链接。">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="assets/fonts/geist.css" />
  <link rel="stylesheet" href="/assets/hark-sub.css?v=2610101100">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/hark-sub.js?v=2610101100"></script>
  <style>
    .copy-page { display: grid; min-height: calc(100vh - 140px); min-height: calc(100dvh - 140px); place-items: center; padding: 24px 0 72px; }
    .copy-box {
      width: min(680px, 100%);
      padding: clamp(24px, 5vw, 44px);
      border-radius: var(--r-l);
      background: var(--fill-tertiary);
      text-align: center;
    }
    .copy-box h1 { font: var(--type-title); margin-bottom: 10px; }
    .copy-target {
      width: 100%;
      margin: 22px 0 6px;
      min-height: var(--tap);
      padding: 12px 18px;
      border: 1px solid var(--stroke-primary);
      border-radius: var(--r-pill);
      color: var(--text-primary);
      background: var(--fill-primary-on);
      font: var(--type-body);
      font-size: 16px;
    }
    .copy-target:focus { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
    .copy-status { min-height: 22px; margin: 14px 0 0; color: var(--text-secondary); font: var(--type-label); }
  </style>
  <link rel="canonical" href="https://20610728.xyz/copylink.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="秋天霹雳">
  <meta property="og:title" content="复制链接 | 秋天霹雳">
  <meta property="og:description" content="新年祝福分享页，一键复制分享链接。">
  <meta property="og:url" content="https://20610728.xyz/copylink.html">
  <meta property="og:image" content="https://20610728.xyz/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div class="page-shell">
    <header class="x-bar hark-bar">
      <a class="x-pill x-brand" href="/" aria-label="秋天霹雳 首页">
        <span class="x-brand__mark" aria-hidden="true">Q</span>
        <span class="x-brand__text"><b>秋天霹雳</b><small>20610728.xyz</small></span>
      </a>
      <nav class="x-pill x-links" aria-label="站点导航">
        <a href="/">首页</a>
        <a href="/posts.html">文章</a>
        <a href="/hark/">项目</a>
      </nav>
      <button class="x-pill x-theme" type="button" data-theme-toggle aria-label="切换深浅色"></button>
    </header>
  <main class="copy-page">
    <section class="copy-box">
      <p class="eyebrow">Copy</p>
      <h1>复制分享链接</h1>
      <p class="hero-text">默认链接指向新版主页，也可以在输入框里改成要分享的内容。</p>
      <input class="copy-target" id="copyTarget" value="https://20610728.xyz/" aria-label="要复制的链接">
      <div class="hero-actions center">
        <button class="button primary" type="button" id="copyButton">复制</button>
        <a class="button secondary" href="/">回到首页</a>
      </div>
      <p class="copy-status" id="copyStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
  </div>
  <script>
    const input = document.getElementById("copyTarget");
    const button = document.getElementById("copyButton");
    const status = document.getElementById("copyStatus");

    async function copyText() {
      const text = input.value.trim();
      if (!text) {
        status.textContent = "请先输入要复制的内容。";
        return;
      }

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          input.select();
          document.execCommand("copy");
        }
        status.textContent = "已复制到剪贴板。";
      } catch (error) {
        status.textContent = "复制失败，请手动选择文本复制。";
      }
    }

    button.addEventListener("click", copyText);
  </script>
</body>
</html>

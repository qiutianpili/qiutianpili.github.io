<body>
  <header class="x-bar hark-bar">
    <a class="x-pill x-brand" href="/" aria-label="秋天霹雳 首页">
      <span class="x-brand__mark" aria-hidden="true">Q</span>
      <span class="x-brand__text"><b>秋天霹雳</b><small>20610728.xyz</small></span>

    <nav class="x-pill x-links" aria-label="站点导航">

    </nav>

  </header>
  <main class="doc">
    <header class="doc-head">
      <p class="doc-eyebrow">404</p>
      <h1>这个页面不在这里</h1>
      <p class="lead">链接可能已经移动或删除。搜一下本站，或者从下面的入口继续。</p>
    </header>
    <input class="nf-search" id="nf-q" type="search" placeholder="搜索文章、工具、项目…" aria-label="搜索本站" autocomplete="off">
    <ul class="nf-res" id="nf-res"></ul>
    <h2>常用入口</h2>
    <p><a class="btn" href="/">首页</a> <a class="btn" href="/posts.html">全部文章</a> <a class="btn" href="/hark/">全部项目</a> <a class="btn" href="/calc/">计算器中心</a></p>
  </main>
  <script src="/assets/site-search.js?v=2610200100"></script>
  <script>
    (function () {
      var IDX = SiteSearch.IDX;
      var q = document.getElementById("nf-q"), res = document.getElementById("nf-res");
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      function show(v) {
        v = v.trim().toLowerCase();
        var hits = SiteSearch.find(v);
        res.innerHTML = hits.map(function (r) { return '<li><a href="' + esc(r[2]) + '"><b>' + esc(r[0]) + "</b><small>" + esc(r[1]) + "</small></a></li>"; }).join("") || "<li><a href=\"/posts.html\"><b>没有找到相关内容</b><small>去文章页看看全部内容</small></a></li>";
      }
      // seed the box with words from the broken URL
      var guess = decodeURIComponent(location.pathname).replace(/\.html?$/, "").split(/[\/_\-.]+/).filter(Boolean).pop() || "";
      q.value = guess; show(guess);
      if (!res.children.length || /没有找到/.test(res.textContent)) { q.value = ""; show(""); }
      q.addEventListener("input", function () { show(q.value); });
    })();
  </script>
</body>
